<div class="auth-container">
  <div class="auth-card">
    <h1>Finance Tracker</h1>
    <h2>Create account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" placeholder="John Doe" />
        <app-field-error [control]="form.get('name')" label="Name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <app-field-error [control]="form.get('email')" label="Email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••" />
        <app-field-error [control]="form.get('password')" label="Password" />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm your password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••" />
        <app-field-error [control]="form.get('confirmPassword')" label="Confirm your password" />
      </div>

      @if (error) {
        <p class="error-banner">{{ error }}</p>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
