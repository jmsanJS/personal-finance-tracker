<div class="auth-container">
  <div class="auth-card">
    <header>
      <h1>
        <a routerLink="/" class="logo">
          <span class="material-icons">track_changes</span>
          FinTrack
        </a>
      </h1>
      <h2>Create account</h2>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" placeholder="John Doe" />
        <app-field-error [control]="form.get('name')" label="Name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <app-field-error [control]="form.get('email')" label="Email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-container">
          <input
            id="password"
            [type]="type()"
            formControlName="password"
            placeholder="••••••••••"
          />
          <button
            class="material-icons"
            type="button"
            (click)="passwordVisible()"
            aria-label="Toggle password visibility"
          >
            {{ type() === 'password' ? 'visibility' : 'visibility_off' }}
          </button>
        </div>
        <app-field-error [control]="form.get('password')" label="Password" />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm your password</label>
        <div class="input-container">
          <input
            id="confirmPassword"
            [type]="confirmType()"
            formControlName="confirmPassword"
            placeholder="••••••••••"
          />
          <button
            class="material-icons"
            type="button"
            (click)="confirmVisible()"
            aria-label="Toggle confirm password visibility"
          >
            {{ confirmType() === 'password' ? 'visibility' : 'visibility_off' }}
          </button>
        </div>
        <app-field-error [control]="form.get('confirmPassword')" label="Confirm your password" />
      </div>

      @if (error()) {
        <p class="error-banner">{{ error() }}</p>
      }

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
